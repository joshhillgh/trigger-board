<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger Board — UK Manufacturing</title>
<style>
  :root{
    --bg:#10151c; --panel:#161d26; --panel-2:#1b232e; --line:#26313f;
    --ink:#e7edf5; --ink-2:#9fb0c4; --ink-3:#6f8094;
    --live:#3ddc97; --warn:#e8c468; --dead:#e4766a; --link:#7fb2ff;
    --seq:#6c8cff; --watch:#e8c468;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
  .wrap{max-width:1320px;margin:0 auto;padding:28px 24px 80px}

  h1{font-size:26px;font-weight:650;letter-spacing:-.01em;margin:0 0 4px}
  .sub{color:var(--ink-3);font-size:13px;margin:0 0 18px}
  .sub b{color:var(--ink-2);font-weight:600}

  .banner{background:#2a2412;border:1px solid #4a3f1c;color:#f0dfa8;
    padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:18px}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
    padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;
    font-family:inherit}
  .tab:hover{border-color:#3a4859;color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--seq);border-color:var(--seq);color:#fff;font-weight:600}
  .tab .n{opacity:.65;margin-left:6px;font-variant-numeric:tabular-nums}

  .searchrow{display:flex;justify-content:flex-end;margin-bottom:18px}
  #q{background:var(--panel);border:1px solid #3a4859;color:var(--ink);
    padding:9px 13px;border-radius:9px;width:290px;max-width:100%;
    font-family:inherit;font-size:14px}
  #q::placeholder{color:var(--ink-3)}

  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 18px 16px;display:flex;flex-direction:column;gap:11px}
  .card.dim{opacity:.72}

  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cname{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0}
  .badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .b-seq{background:#273255;color:#a9bcff}
  .b-sequence{background:#143a2b;color:var(--live)}
  .b-watchlist{background:#3a3214;color:var(--warn)}
  .b-tier1{background:#2d2533;color:#c8aee0}
  .b-disqualified{background:#2c2322;color:#e0a39a}

  .meta{color:var(--ink-3);font-size:12.5px;margin:-4px 0 0}
  .trig{font-size:14px;line-height:1.55;margin:0}

  .bar{height:5px;background:#222c38;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .decay{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px}
  .decay b{font-variant-numeric:tabular-nums;font-weight:600}

  details{border-top:1px solid var(--line);padding-top:9px}
  summary{cursor:pointer;font-size:13px;color:var(--link);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"▸ ";color:var(--ink-3)}
  details[open] summary:before{content:"▾ "}
  .dbody{padding:10px 0 2px;font-size:13.5px;color:var(--ink-2);
    display:flex;flex-direction:column;gap:10px}
  .dbody h4{margin:0 0 3px;font-size:12.5px;color:var(--ink-3);font-weight:600}
  .dbody p{margin:0}
  .dbody ul{margin:0;padding-left:17px}
  .dbody li{margin-bottom:2px}
  .flag-g li::marker{color:var(--live)}
  .flag-r li::marker{color:var(--dead)}
  .flag-u li::marker{color:var(--ink-3)}

  pre.draft{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:12px;margin:0;white-space:pre-wrap;font:13px/1.6 inherit;color:var(--ink)}
  .tok{color:var(--warn)}

  textarea.note{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:10px;font:13.5px/1.5 inherit;resize:vertical;min-height:64px;width:100%}
  textarea.note::placeholder{color:var(--ink-3)}

  .foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  select.status{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 10px;font:13.5px inherit;flex:1;min-width:140px}
  .btn{background:none;border:1px solid var(--line);color:var(--link);
    border-radius:8px;padding:8px 12px;font:13.5px inherit;cursor:pointer}
  .btn:hover{border-color:var(--link)}
  .btn.ok{color:var(--live);border-color:var(--live)}

  .empty{background:var(--panel);border:1px dashed #3a4859;border-radius:var(--r);
    padding:26px;color:var(--ink-2);max-width:760px}
  .empty h3{margin:0 0 8px;font-size:16px;color:var(--ink)}
  .empty code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-size:12.5px}

  .newslist{display:flex;flex-direction:column;gap:2px;max-width:860px}
  .newsrow{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
  .newsrow time{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0;width:92px}
  .newsrow .src{color:var(--ink-3);font-size:12.5px}

  .hide{display:none}
  @media (prefers-reduced-motion:no-preference){
    .btn,.tab{transition:border-color .12s,color .12s}
  }
  @media (max-width:560px){
    .wrap{padding:20px 14px 60px}
    .grid{grid-template-columns:1fr}
    #q{width:100%}
    .searchrow{justify-content:stretch}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trigger Board</h1>
  <p class="sub">Buying-trigger sweep · data as of <b id="asof">—</b> · decay countdowns computed live · status and notes saved in this browser</p>
  <div class="banner" id="banner"></div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="searchrow" id="searchrow">
    <input id="q" type="search" placeholder="Search company, trigger, HQ…" aria-label="Search accounts">
  </div>

  <div id="grid" class="grid"></div>
  <div id="news" class="newslist hide"></div>
  <div id="cases" class="hide"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var B = window.BOARD;
  if(!B){ document.getElementById('grid').innerHTML =
    '<div class="empty"><h3>data.js did not load</h3><p>Keep <code>dashboard.html</code> and <code>data.js</code> in the same folder, then reopen this page.</p></div>'; return; }

  var LABEL = { sequence:"Sequence-eligible", watchlist:"Watchlist", tier1:"Tier 1", disqualified:"Disqualified" };
  var DAY = 86400000;

  // Storage: localStorage where allowed, memory otherwise, so nothing throws.
  var mem = {};
  var store = {
    get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]===undefined?null:mem[k]; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };

  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function addMonths(d,m){ var x=new Date(d.getTime()); var day=x.getDate();
    x.setMonth(x.getMonth()+m); if(x.getDate()<day) x.setDate(0); return x; }

  function fmt(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

  function decay(a){
    if(!a.triggerDate) return null;
    var t = new Date(a.triggerDate+"T00:00:00");
    var now = new Date(); now.setHours(0,0,0,0);
    var old = Math.round((now-t)/DAY);
    if(!a.windowMonths) return { old:old, none:true };
    var exp = addMonths(t,a.windowMonths);
    var total = Math.round((exp-t)/DAY);
    var left = Math.round((exp-now)/DAY);
    return { old:old, left:left, total:total, exp:exp,
             pct: Math.max(0, Math.min(100, Math.round(left/total*100))) };
  }

  function decayColour(d){
    if(d.left<=0) return 'var(--dead)';
    if(d.left<=45) return 'var(--warn)';
    return 'var(--live)';
  }

  function matchCases(a){
    if(!B.caseStudies || !B.caseStudies.length) return [];
    var tags = a.caseStudyTags||[];
    return B.caseStudies.map(function(c){
      var hits = (c.tags||[]).filter(function(t){ return tags.indexOf(t)>-1; });
      return { c:c, n:hits.length, hits:hits };
    }).filter(function(x){ return x.n>0; })
      .sort(function(p,q){ return q.n-p.n; });
  }

  function list(title,items,cls){
    if(!items||!items.length) return "";
    return '<div><h4>'+esc(title)+'</h4><ul class="'+cls+'">'+
      items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join('')+'</ul></div>';
  }

  function draftBlock(label,text){
    if(!text) return "";
    var html = esc(text).replace(/\{\{first\}\}/g,'<span class="tok">{{first}}</span>');
    return '<div><h4>'+esc(label)+'</h4><pre class="draft">'+html+'</pre>'+
      '<button class="btn copy" data-copy="'+esc(text)+'" style="margin-top:7px">Copy '+esc(label.toLowerCase())+'</button></div>';
  }

  function card(a){
    var d = decay(a);
    var h = [];
    h.push('<article class="card'+(a.bucket==='disqualified'||a.bucket==='tier1'?' dim':'')+'" data-id="'+esc(a.id)+'">');

    h.push('<div class="chead"><h2 class="cname">'+esc(a.name)+'</h2><div class="badges">');
    if(a.seq) h.push('<span class="badge b-seq">Seq '+esc(a.seq)+'</span>');
    h.push('<span class="badge b-'+esc(a.bucket)+'">'+esc(LABEL[a.bucket]||a.bucket)+'</span>');
    h.push('</div></div>');

    h.push('<p class="meta">'+esc(a.hq)+(a.revenue?' · '+esc(a.revenue):'')+'</p>');
    h.push('<p class="trig">'+esc(a.trigger)+'</p>');

    if(d && !d.none){
      h.push('<div class="bar"><i style="width:'+d.pct+'%;background:'+decayColour(d)+'"></i></div>');
      h.push('<div class="decay"><span>Triggered '+fmt(new Date(a.triggerDate+"T00:00:00"))+' ('+d.old+'d ago)</span>'+
        '<b style="color:'+decayColour(d)+'">'+(d.left>0?d.left+' days left':'window closed')+'</b>'+
        '<span style="color:'+decayColour(d)+'">· expires '+fmt(d.exp)+'</span></div>');
    } else if(d){
      h.push('<div class="decay"><span>Dated '+fmt(new Date(a.triggerDate+"T00:00:00"))+' ('+d.old+'d ago) · no decay window</span></div>');
    }

    if(a.source) h.push('<p style="margin:0"><a href="'+esc(a.source)+'" target="_blank" rel="noopener">Source ↗</a></p>');

    // Read: deciding question, persona, angle, flags, case studies
    var read = [];
    if(a.decidingQuestion) read.push('<div><h4>The question that decides it</h4><p>'+esc(a.decidingQuestion)+'</p></div>');
    if(a.persona) read.push('<div><h4>Entry persona</h4><p>'+esc(a.persona)+'</p></div>');
    if(a.angle) read.push('<div><h4>Angle</h4><p>'+esc(a.angle)+'</p></div>');
    read.push(list('Green flags',a.green,'flag-g'));
    read.push(list('Red flags',a.red,'flag-r'));
    read.push(list('Not verified',a.unverified,'flag-u'));
    if(a.reentry) read.push('<div><h4>Second usable date</h4><p>'+esc(a.reentry)+'</p></div>');
    if(a.services && a.services.length) read.push('<div><h4>Services fit</h4><p>'+esc(a.services.join(', '))+'</p></div>');
    if(a.note) read.push('<div><h4>Read carefully</h4><p>'+esc(a.note)+'</p></div>');

    var cs = matchCases(a);
    if(cs.length){
      read.push('<div><h4>Case studies to send</h4><ul>'+cs.map(function(x){
        return '<li>'+esc(x.c.client)+(x.c.outcome?', '+esc(x.c.outcome):'')+
          ' <span style="color:var(--ink-3)">('+esc(x.hits.join(', '))+')</span></li>';
      }).join('')+'</ul></div>');
    } else if((a.caseStudyTags||[]).length && a.bucket==='sequence'){
      read.push('<div><h4>Case studies to send</h4><p style="color:var(--ink-3)">None loaded. Add them to <code>data.js</code> and they will match on: '+esc((a.caseStudyTags||[]).join(', '))+'</p></div>');
    }
    h.push('<details><summary>Deciding question · persona · angle</summary><div class="dbody">'+read.join('')+'</div></details>');

    if(a.drafts){
      var dr = [];
      if(a.drafts.whyReachOut) dr.push('<div><h4>Why reach out now</h4><p>'+esc(a.drafts.whyReachOut)+'</p></div>');
      if(a.drafts.servicesFit) dr.push('<div><h4>How our services fit</h4><p>'+esc(a.drafts.servicesFit)+'</p></div>');
      dr.push(draftBlock('Email',a.drafts.email));
      dr.push(draftBlock('Call intro',a.drafts.callIntro));
      dr.push(draftBlock('LinkedIn',a.drafts.linkedin));
      h.push('<details><summary>Outreach drafts · email · call intro · LinkedIn</summary><div class="dbody">'+dr.join('')+'</div></details>');
    }

    h.push('<textarea class="note" data-note="'+esc(a.id)+'" placeholder="Your notes… (saved in this browser)"></textarea>');

    h.push('<div class="foot"><select class="status" data-status="'+esc(a.id)+'">'+
      ['Not started','Researching','Contact found','Sequenced','Replied','Meeting booked','Parked','Dead']
      .map(function(s){ return '<option>'+s+'</option>'; }).join('')+'</select>');
    if(a.angle) h.push('<button class="btn copy" data-copy="'+esc(a.angle)+'">Copy angle</button>');
    if(a.source) h.push('<button class="btn copy" data-copy="'+esc(a.source)+'">Copy link</button>');
    h.push('</div></article>');
    return h.join('');
  }

  // Render
  document.getElementById('asof').textContent = B.dataAsOf || '—';
  var ban = document.getElementById('banner');
  if(B.banner){ ban.textContent = B.banner; } else { ban.classList.add('hide'); }

  var counts = {};
  B.accounts.forEach(function(a){ counts[a.bucket]=(counts[a.bucket]||0)+1; });

  var VIEWS = [{k:'all',t:'All',n:B.accounts.length}]
    .concat(['sequence','watchlist','tier1','disqualified']
      .filter(function(k){ return counts[k]; })
      .map(function(k){ return {k:k,t:LABEL[k],n:counts[k]}; }))
    .concat([{k:'news',t:'News feed',n:(B.news||[]).length},
             {k:'cases',t:'Case studies',n:(B.caseStudies||[]).length}]);

  var tabs = document.getElementById('tabs');
  tabs.innerHTML = VIEWS.map(function(v,i){
    return '<button class="tab" role="tab" data-view="'+v.k+'" aria-selected="'+(i===0)+'">'+
      esc(v.t)+'<span class="n">'+v.n+'</span></button>';
  }).join('');

  var grid = document.getElementById('grid'),
      newsEl = document.getElementById('news'),
      casesEl = document.getElementById('cases'),
      searchrow = document.getElementById('searchrow'),
      q = document.getElementById('q');

  newsEl.innerHTML = (B.news||[]).length
    ? (B.news||[]).map(function(n){
        return '<div class="newsrow"><time>'+esc(n.date)+'</time><div><a href="'+esc(n.url)+
          '" target="_blank" rel="noopener">'+esc(n.title)+'</a> <span class="src">'+esc(n.source)+'</span></div></div>';
      }).join('')
    : '<div class="empty"><h3>No news items</h3><p>The sweep writes the week\'s sector headlines here. Stories involving closures, redundancies, fires or insolvency are filtered out, because they can never be referenced in outreach.</p></div>';

  casesEl.innerHTML = (B.caseStudies||[]).length
    ? '<div class="grid">'+B.caseStudies.map(function(c){
        return '<article class="card"><h2 class="cname">'+esc(c.client)+'</h2>'+
          '<p class="meta">'+esc(c.sector||'')+(c.services&&c.services.length?' · '+esc(c.services.join(', ')):'')+'</p>'+
          (c.problem?'<p class="trig">'+esc(c.problem)+'</p>':'')+
          (c.outcome?'<p style="margin:0;color:var(--live);font-size:13.5px">'+esc(c.outcome)+'</p>':'')+
          '<p class="meta">Tags: '+esc((c.tags||[]).join(', '))+'</p>'+
          (c.url?'<p style="margin:0"><a href="'+esc(c.url)+'" target="_blank" rel="noopener">Open ↗</a></p>':'')+
          '</article>';
      }).join('')+'</div>'
    : '<div class="empty"><h3>No case studies loaded</h3>'+
      '<p>Nothing is invented here, so this stays empty until you add yours. Open <code>data.js</code>, fill the <code>caseStudies</code> array, and each account card will list the ones whose tags overlap its trigger.</p>'+
      '<p style="margin-top:10px">One entry looks like this:</p>'+
      '<pre class="draft" style="margin-top:8px">{ id: "acme-wms",\n  client: "Acme Components",\n  sector: "Automotive tier 2",\n  problem: "WMS and ERP out of step through a DC move",\n  whatWeDid: "Embedded integration team for 14 weeks",\n  outcome: "Cutover with no reporting outage",\n  services: ["Extended Teams"],\n  tags: ["erp-integration","warehouse","cutover"],\n  url: "" }</pre></div>';

  function render(view, term){
    var showGrid = (view!=='news' && view!=='cases');
    grid.classList.toggle('hide', !showGrid);
    newsEl.classList.toggle('hide', view!=='news');
    casesEl.classList.toggle('hide', view!=='cases');
    searchrow.classList.toggle('hide', !showGrid);
    if(!showGrid) return;

    term = (term||'').trim().toLowerCase();
    var rows = B.accounts.filter(function(a){
      if(view!=='all' && a.bucket!==view) return false;
      if(!term) return true;
      return [a.name,a.trigger,a.hq,a.revenue,a.angle,a.ownership]
        .join(' ').toLowerCase().indexOf(term)>-1;
    });

    grid.innerHTML = rows.length ? rows.map(card).join('')
      : '<div class="empty"><h3>Nothing matches</h3><p>Clear the search, or pick another tab.</p></div>';

    // Restore saved state
    grid.querySelectorAll('[data-note]').forEach(function(t){
      var v = store.get('tb.note.'+t.dataset.note); if(v) t.value = v;
      t.addEventListener('input', function(){ store.set('tb.note.'+t.dataset.note, t.value); });
    });
    grid.querySelectorAll('[data-status]').forEach(function(s){
      var v = store.get('tb.status.'+s.dataset.status); if(v) s.value = v;
      s.addEventListener('change', function(){ store.set('tb.status.'+s.dataset.status, s.value); });
    });
  }

  tabs.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if(!b) return;
    tabs.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t===b); });
    render(b.dataset.view, q.value);
  });

  q.addEventListener('input', function(){
    var cur = tabs.querySelector('[aria-selected="true"]');
    render(cur?cur.dataset.view:'all', q.value);
  });

  document.addEventListener('click', function(e){
    var b = e.target.closest('.copy'); if(!b) return;
    var txt = b.getAttribute('data-copy'), old = b.textContent;
    function done(){ b.textContent='Copied'; b.classList.add('ok');
      setTimeout(function(){ b.textContent=old; b.classList.remove('ok'); },1200); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=txt;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); done(); }catch(err){ b.textContent='Copy failed'; setTimeout(function(){b.textContent=old;},1200); }
      document.body.removeChild(ta);
    }
  });

  render('all','');
})();
</script>
</body>
</html>
